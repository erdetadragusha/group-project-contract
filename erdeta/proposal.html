
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Proposal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            color: #222;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .back {
            color: #3458a4;
            text-decoration: none;
        }

        h1 {
            color: #263b63;
            font-size: 25px;
            text-align: center;
        }

        p {
            color: #555;
            line-height: 1.5;
            text-align: center;
        }

        .form-group {
            margin: 25px 0;
        }

        label {
            display: block;
            font-weight: bold;
            color: #263b63;
            margin-bottom: 10px;
        }

        select, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font: 15px Arial, sans-serif;
            color: #222;
            background: white;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
            line-height: 1.6;
        }

        .info-box {
            padding: 15px;
            background: #eef3ff;
            border-radius: 10px;
            margin: 20px 0;
            color: #263b63;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .example {
            background: #f8f9fc;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .example strong {
            color: #263b63;
        }

        .example p {
            font-size: 13px;
            text-align: left;
        }

        .hint {
            font-size: 12px;
            color: #666;
            text-align: left;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        a:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        #message {
            margin-top: 15px;
            line-height: 1.5;
            color: #b42318;
        }

        @media (max-width: 450px) {
            .container {
                margin: 15px auto;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <a href="disagreements.html" id="backLink" class="back">
            ← Back
        </a>

        <div class="form-group">
            <label for="languageSelector" data-i18n="language">
                Language
            </label>

            <select id="languageSelector">
                <option value="en">English</option>
                <option value="hr">Hrvatski</option>
                <option value="sq">Shqip</option>
            </select>
        </div>

        <h1 data-i18n="title">Create Proposal</h1>

        <p data-i18n="description">
            Suggest a solution to help your team reach an agreement.
        </p>

        <form id="proposalForm">

            <div class="form-group">
                <label for="topic" data-i18n="topicLabel">
                    Choose a disagreement topic:
                </label>

                <select id="topic" required>
                    <option value="">Select a topic</option>
                </select>
            </div>

            <div class="info-box" id="comparisonInfo"
                 role="status" aria-live="polite">
                Loading preferences...
            </div>

            <div class="form-group">
                <label for="proposalText" data-i18n="solutionLabel">
                    Your proposed solution:
                </label>

                <textarea
                    id="proposalText"
                    minlength="10"
                    maxlength="1000"
                    required
                    placeholder="Write your suggested solution here..."
                ></textarea>

                <p class="hint" data-i18n="hint">
                    Explain how your team could solve this disagreement.
                </p>
            </div>

            <div class="example">
                <strong data-i18n="exampleTitle">Example proposal</strong>

                <p data-i18n="exampleText">
                    We can set deadlines two days before the actual submission date.
                    This gives everyone extra time to check their work.
                </p>
            </div>

            <button type="submit" id="submitButton" disabled
                    data-i18n="submit">
                Submit Proposal
            </button>

            <p id="message" role="alert"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../mateo/supabase-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.16.8/dist/umd/i18next.min.js"></script>

                    saveError: "Propozimi nuk u ruajt. Provoni përsëri.",
                    saving: "Duke ruajtur propozimin...",
                    categories: {

                        Other: "Tjetër",
                        Research: "Hulumtim",
                        Design: "Dizajn",
                        Development: "Zhvillim",
                        Testing: "Testim",
                        Documentation: "Dokumentim",
                        "Strict deadlines": "Afate të rrepta",
                        "Some flexibility": "Pak fleksibilitet",
                        Flexible: "Afate fleksibile",
                        Accuracy: "Saktësia",
                        "Good design / usability": "Dizajn i mirë / lehtësi në përdorim",
                        "Clean work": "Punë e rregullt",
                        "Detailed documentation": "Dokumentim i detajuar",
                        "Flexible schedule": "Orar fleksibil"
                    },
                    days: {
                        Monday: "E hënë",
                        Tuesday: "E martë",
                        Wednesday: "E mërkurë",
                        Thursday: "E enjte",
                        Friday: "E premte",
                        Saturday: "E shtunë",
                        Sunday: "E diel"

                    periods: {

        const form = document.getElementById("proposalForm");
        const topic = document.getElementById("topic");
        const proposalText = document.getElementById("proposalText");
        const comparisonInfo = document.getElementById("comparisonInfo");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");
        const languageSelector = document.getElementById("languageSelector");
        const backLink = document.getElementById("backLink");

        const teamId = new URLSearchParams(
            window.location.search
        ).get("teamId");

        if (teamId) {
            backLink.href =
                "disagreements.html?teamId=" + encodeURIComponent(teamId);
        }

        let currentUserId = null;
        let teammateId = null;
        let differences = [];
        let statusKey = "loading";
        let ready = false;

        function showStatus(key) {
            statusKey = key;
            message.textContent = key ? i18next.t(key) : "";
        }

        function arrayOrEmpty(value) {
            return Array.isArray(value) ? value : [];
        }

        function availabilityChoices(value) {
            if (!value || typeof value !== "object") {
                return [];
            }

            const times = arrayOrEmpty(value.times)
                .filter(function(item) {
                    return typeof item === "string";
                })
                .map(function(item) {
                    return item.replace("-", " ");
                });

            if (value.flexible === true) {
                times.push("Flexible schedule");
            }

            return times;
        }

        function categories(record) {
            return [
                {
                    category: "Communication",
                    values: arrayOrEmpty(record.communication)
                },
                {
                    category: "Availability",
                    values: availabilityChoices(record.availability)
                },
                {
                    category: "Preferred Roles",
                    values: arrayOrEmpty(record.roles)
                },
                {
                    category: "Deadlines",
                    values: record.deadline ? [record.deadline] : []
                },
                {
                    category: "Quality",
                    values: arrayOrEmpty(record.quality)
                }
            ];
        }

        function sameChoices(first, second) {
            const a = [...new Set(first)].sort();
            const b = [...new Set(second)].sort();

            return JSON.stringify(a) === JSON.stringify(b);
        }

        function translateValue(value) {
            const directKey = "values." + value;

            if (i18next.exists(directKey)) {
                return i18next.t(directKey);
            }

            const parts = value.split(" ");

            if (
                parts.length === 2 &&
                i18next.exists("days." + parts[0]) &&
                i18next.exists("periods." + parts[1])
            ) {
                return i18next.t("days." + parts[0]) +
                    " — " + i18next.t("periods." + parts[1]);
            }

            return value;
        }

        function translateChoices(values) {
            return values.length
                ? values.map(translateValue).join(", ")
                : i18next.t("notSelected");
        }

        function renderComparisonInfo() {
            const selected = differences.find(function(item) {
                return item.category === topic.value;
            });

            if (!selected) {
                comparisonInfo.textContent = i18next.t("selectInfo");
                return;
            }

            comparisonInfo.textContent =
                i18next.t("yourPreference") + ": " +
                translateChoices(selected.mine) + "\n" +
                i18next.t("teammate") + ": " +
                translateChoices(selected.teammate);
        }

        function renderTopics() {
            const previous = topic.value;

            topic.replaceChildren();

            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = i18next.t("selectTopic");
            topic.appendChild(placeholder);

            differences.forEach(function(item) {
                const option = document.createElement("option");
                option.value = item.category;
                option.textContent = i18next.t(
                    "categories." + item.category
                );
                topic.appendChild(option);
            });

            const selectedFromPreviousScreen = (() => {
                try {
                    return localStorage.getItem("selectedDisagreement");
                } catch (error) {
                    return "";
                }
            })();

            const preferred = previous || selectedFromPreviousScreen;

            if (differences.some(function(item) {
                return item.category === preferred;
            })) {
                topic.value = preferred;
            }

            renderComparisonInfo();
        }

        function updateLanguage() {
            document.documentElement.lang = i18next.language;
            document.title = i18next.t("title");

            document.querySelectorAll("[data-i18n]").forEach(function(element) {
                element.textContent = i18next.t(
                    element.getAttribute("data-i18n")
                );
            });

            proposalText.placeholder = i18next.t("placeholder");
            backLink.textContent = "← " + i18next.t("back");
            languageSelector.value = i18next.language;

            renderTopics();

            if (statusKey) {
                message.textContent = i18next.t(statusKey);
            }
        }

        async function loadDifferences() {
            submitButton.disabled = true;
            ready = false;
            showStatus("loading");

            if (!teamId) {
                showStatus("noTeam");
                return;
            }

            let comparisonTeamId;

            try {
                comparisonTeamId = localStorage.getItem(
                    "groupComparisonTeamId"
                );
                teammateId = localStorage.getItem(
                    "groupComparisonTeammateId"
                );
            } catch (error) {
                showStatus("noComparison");
                return;
            }

            if (comparisonTeamId !== teamId || !teammateId) {
                showStatus("noComparison");
                return;
            }

            try {
                const { data: authData, error: authError } =
                    await database.auth.getUser();

                if (authError || !authData.user) {
                    throw new Error("NOT_SIGNED_IN");
                }

                currentUserId = authData.user.id;

                if (currentUserId === teammateId) {
                    showStatus("noComparison");
                    return;
                }

                const { data: members, error: memberError } =
                    await database.rpc("get_team_members", {
                        p_team_id: teamId
                    });

                if (memberError) {
                    throw memberError;
                }

                if (!(members || []).some(function(member) {
                    return member.user_id === teammateId;
                })) {
                    showStatus("noComparison");
                    return;
                }

                const { data: rows, error } = await database
                    .from("team_preferences")
                    .select(
                        "user_id,communication,availability,roles,deadline,quality"
                    )
                    .eq("team_id", teamId)
                    .in("user_id", [currentUserId, teammateId]);

                if (error) {
                    throw error;
                }

                const mine = (rows || []).find(function(row) {
                    return row.user_id === currentUserId;
                });

                const teammate = (rows || []).find(function(row) {
                    return row.user_id === teammateId;
                });

                if (!mine || !teammate) {
                    showStatus("noComparison");
                    return;
                }

                const myCategories = categories(mine);
                const teammateCategories = categories(teammate);

                differences = myCategories
                    .map(function(item, index) {
                        return {
                            category: item.category,
                            mine: item.values,
                            teammate: teammateCategories[index].values
                        };
                    })
                    .filter(function(item) {
                        return item.mine.length > 0 &&
                            item.teammate.length > 0 &&
                            !sameChoices(item.mine, item.teammate);
                    });

                renderTopics();

                if (differences.length === 0) {
                    showStatus("noDisagreements");
                    return;
                }

                ready = true;
                submitButton.disabled = false;
                showStatus(null);

            } catch (error) {
                showStatus(
                    error.message === "NOT_SIGNED_IN"
                        ? "loginError"
                        : "loadError"
                );
            }
        }

        topic.addEventListener("change", function() {
            renderComparisonInfo();
            showStatus(null);
        });

        proposalText.addEventListener("input", function() {
            showStatus(null);
        });

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!ready || submitButton.disabled) {
                return;
            }

            const selectedTopic = topic.value;
            const writtenProposal = proposalText.value.trim();

            if (!differences.some(function(item) {
                return item.category === selectedTopic;
            })) {
                showStatus("topicError");
                topic.focus();
                return;
            }

            if (writtenProposal.length < 10) {
                showStatus("lengthError");
                proposalText.focus();
                return;
            }

            submitButton.disabled = true;
            showStatus("saving");

            try {
                const { data: authData, error: authError } =
                    await database.auth.getUser();

                if (
                    authError ||
                    !authData.user ||
                    authData.user.id !== currentUserId
                ) {
                    throw new Error("NOT_SIGNED_IN");
                }

                const { data, error } = await database
                    .from("preference_proposals")
                    .insert({
                        team_id: teamId,
                        author_id: currentUserId,
                        teammate_id: teammateId,
                        topic: selectedTopic,
                        proposal_text: writtenProposal
                    })
                    .select("id,created_at")
                    .single();

                if (error) {
                    throw error;
                }

                try {
                    localStorage.setItem(
                        "groupProposal",
                        JSON.stringify({
                            id: data.id,
                            teamId: teamId,
                            teammateId: teammateId,
                            topic: selectedTopic,
                            text: writtenProposal,
                            status: "pending",
                            createdAt: data.created_at
                        })
                    );

                    localStorage.setItem(
                        "selectedDisagreement",
                        selectedTopic
                    );
                } catch (error) {
                }

                window.location.href =
                    "review.html?teamId=" +
                    encodeURIComponent(teamId) +
                    "&proposalId=" +
                    encodeURIComponent(data.id);

            } catch (error) {
                showStatus(
                    error.message === "NOT_SIGNED_IN"
                        ? "loginError"
                        : "saveError"
                );
                submitButton.disabled = false;
            }
        });

        let savedLanguage = "en";

        try {
            savedLanguage = localStorage.getItem("appLanguage") || "en";
        } catch (error) {
            savedLanguage = "en";
        }

        if (!resources[savedLanguage]) {
            savedLanguage = "en";
        }

        i18next.init({
            lng: savedLanguage,
            fallbackLng: "en",
            supportedLngs: ["en", "hr", "sq"],
            resources: resources
        }).then(function() {
            updateLanguage();
            loadDifferences();

            languageSelector.addEventListener("change", function() {
                const language = languageSelector.value;

                i18next.changeLanguage(language).then(function() {
                    try {
                        localStorage.setItem("appLanguage", language);
                    } catch (error) {
                    }

                    updateLanguage();
                });
            });
        });
    </script>
</body>
</html>
