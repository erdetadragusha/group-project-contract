<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quality Expectations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            background: white;
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .back {
            color: #3458a4;
            text-decoration: none;
            font-size: 16px;
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #263b63;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 25px 0;
        }

        legend {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
        }

        .option:hover {
            background-color: #eef3ff;
        }

        .option:has(input:checked) {
            background-color: #eef3ff;
            border-color: #3458a4;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #3458a4;
            cursor: pointer;
            flex-shrink: 0;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #263b63;
        }

        button:focus-visible,
        input:focus-visible,
        a:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        #message {
            margin-top: 15px;
            color: #b42318;
        }

        @media (max-width: 450px) {
            .container {
                padding: 20px;
                margin: 15px auto;
            }
        }
    </style>

</head>

<body>

    <main class="container">

        <a href="deadlines.html" class="back">
            ← Back
        </a>

        <h1>Quality Expectations</h1>

        <p>What is most important to you when it comes to the quality of your group project?</p>

        <form id="qualityForm">

            <fieldset>

                <legend>Select what matters most to you:</legend>

                <label class="option">
                    <input type="checkbox" name="quality" value="Accuracy">
                    Accuracy
                </label>

                <label class="option">
                    <input type="checkbox" name="quality" value="Good design / usability">
                    Good design / usability
                </label>

                <label class="option">
                    <input type="checkbox" name="quality" value="Clean work">
                    Clean work
                </label>

                <label class="option">
                    <input type="checkbox" name="quality" value="Detailed documentation">
                    Detailed documentation
                </label>

                <label class="option">
                    <input type="checkbox" name="quality" value="Other">
                    Other
                </label>

            </fieldset>

            <button type="submit">Next</button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

    </main>

    <script>
        const form = document.getElementById("qualityForm");
        const message = document.getElementById("message");
        const checkboxes = document.querySelectorAll(
            'input[name="quality"]'
        );

        try {
            const savedQuality = JSON.parse(
                localStorage.getItem("qualityExpectations") || "[]"
            );

            if (Array.isArray(savedQuality)) {
                checkboxes.forEach(function(checkbox) {
                    checkbox.checked = savedQuality.includes(
                        checkbox.value
                    );
                });
            }

        } catch (error) {
            message.textContent =
                "Previous quality preferences could not be loaded.";
        }

        checkboxes.forEach(function(checkbox) {
            checkbox.addEventListener("change", function() {
                message.textContent = "";
            });
        });

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const selected = Array.from(
                document.querySelectorAll(
                    'input[name="quality"]:checked'
                )
            ).map(function(input) {
                return input.value;
            });

            if (selected.length === 0) {
                message.textContent =
                    "Please select at least one quality expectation.";
                return;
            }

            try {
                localStorage.setItem(
                    "qualityExpectations",
                    JSON.stringify(selected)
                );

                window.location.href = "comparison.html";

            } catch (error) {
                message.textContent =
                    "Could not save your quality preferences. Please try again.";
            }

        });
    </script>

</body>
</html>
