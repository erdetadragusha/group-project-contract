
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Expectations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            background: white;
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .back {
            color: #3458a4;
            text-decoration: none;
            font-size: 16px;
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #263b63;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 25px 0;
        }

        legend {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
        }

        .option:hover {
            background-color: #eef3ff;
        }

        .option:has(input:checked) {
            background-color: #eef3ff;
            border-color: #3458a4;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #3458a4;
            cursor: pointer;
            flex-shrink: 0;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #263b63;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        button:focus-visible,
        input:focus-visible,
        a:focus-visible,
        select:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        .language-box {
            margin: 20px 0;
        }

        .language-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .language-box select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        #message {
            margin-top: 15px;
            color: #b42318;
        }

        @media (max-width: 450px) {
            .container {
                padding: 20px;
                margin: 15px auto;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <a href="deadlines.html" class="back" id="backLink">
            ← Back
        </a>

        <div class="language-box">
            <label for="languageSelector" data-i18n="language">
                Language
            </label>

            <select id="languageSelector">
                <option value="en">English</option>
                <option value="hr">Hrvatski</option>
                <option value="sq">Shqip</option>
            </select>
        </div>

        <h1 data-i18n="title">Quality Expectations</h1>

        <p data-i18n="question">
            What is most important to you when it comes to the quality of your group project?
        </p>

        <form id="qualityForm">
            <fieldset>
                <legend data-i18n="instruction">
                    Select what matters most to you:
                </legend>

                <label class="option">
                    <input type="checkbox" name="quality" value="Accuracy">
                    <span data-i18n="accuracy">Accuracy</span>
                </label>

                <label class="option">
                    <input type="checkbox" name="quality" value="Good design / usability">
                    <span data-i18n="design">Good design / usability</span>
                </label>

                <label class="option">
                    <input type="checkbox" name="quality" value="Clean work">
                    <span data-i18n="clean">Clean work</span>
                </label>

                <label class="option">
                    <input type="checkbox" name="quality" value="Detailed documentation">
                    <span data-i18n="documentation">Detailed documentation</span>
                </label>

                <label class="option">
                    <input type="checkbox" name="quality" value="Other">
                    <span data-i18n="other">Other</span>
                </label>
            </fieldset>

            <button type="submit" id="nextButton" disabled data-i18n="next">
                Next
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../mateo/supabase-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.16.8/dist/umd/i18next.min.js"></script>

    <script>
        const resources = {
            en: {
                translation: {
                    title: "Quality Expectations",
                    question: "What is most important to you when it comes to the quality of your group project?",
                    instruction: "Select what matters most to you:",
                    accuracy: "Accuracy",
                    design: "Good design / usability",
                    clean: "Clean work",
                    documentation: "Detailed documentation",
                    other: "Other",
                    back: "Back",
                    next: "Next",
                    language: "Language",
                    requiredError: "Please select at least one quality expectation.",
                    loadError: "Previous quality preferences could not be loaded.",
                    saveError: "Could not save your quality preferences. Please try again.",
                    teamError: "Please open this page from your team.",
                    loginError: "Please sign in through the team setup first.",
                    loading: "Loading your quality preferences...",
                    saving: "Saving your quality preferences..."
                }
            },

            hr: {
                translation: {
                    title: "Očekivanja kvalitete",
                    question: "Što vam je najvažnije kada je riječ o kvaliteti grupnog projekta?",
                    instruction: "Odaberite što vam je najvažnije:",
                    accuracy: "Točnost",
                    design: "Dobar dizajn / jednostavnost korištenja",
                    clean: "Uredno obavljen posao",
                    documentation: "Detaljna dokumentacija",
                    other: "Ostalo",
                    back: "Natrag",
                    next: "Dalje",
                    language: "Jezik",
                    requiredError: "Odaberite barem jedno očekivanje kvalitete.",
                    loadError: "Prethodne postavke kvalitete nije moguće učitati.",
                    saveError: "Postavke kvalitete nije moguće spremiti. Pokušajte ponovno.",
                    teamError: "Otvorite ovu stranicu iz svojeg tima.",
                    loginError: "Najprije se prijavite putem postavljanja tima.",
                    loading: "Učitavanje postavki kvalitete...",
                    saving: "Spremanje postavki kvalitete..."
                }
            },

            sq: {
                translation: {
                    title: "Pritshmëritë për cilësinë",
                    question: "Çfarë është më e rëndësishme për ju kur bëhet fjalë për cilësinë e projektit në grup?",
                    instruction: "Zgjidhni çfarë ka më shumë rëndësi për ju:",
                    accuracy: "Saktësia",
                    design: "Dizajn i mirë / lehtësi në përdorim",
                    clean: "Punë e rregullt",
                    documentation: "Dokumentim i detajuar",
                    other: "Tjetër",
                    back: "Kthehu",
                    next: "Vazhdo",
                    language: "Gjuha",
                    requiredError: "Ju lutemi zgjidhni të paktën një pritshmëri për cilësinë.",
                    loadError: "Preferencat e mëparshme për cilësinë nuk mund të ngarkohen.",
                    saveError: "Preferencat për cilësinë nuk u ruajtën. Provoni përsëri.",
                    teamError: "Hapeni këtë faqe nga ekipi juaj.",
                    loginError: "Ju lutemi hyni fillimisht përmes ekipit.",
                    loading: "Duke ngarkuar preferencat për cilësinë...",
                    saving: "Duke ruajtur preferencat për cilësinë..."
                }
            }
        };

        const form = document.getElementById("qualityForm");
        const message = document.getElementById("message");
        const nextButton = document.getElementById("nextButton");
        const backLink = document.getElementById("backLink");
        const languageSelector = document.getElementById("languageSelector");

        const checkboxes = document.querySelectorAll(
            'input[name="quality"]'
        );

        const teamId = new URLSearchParams(
            window.location.search
        ).get("teamId");

        if (teamId) {
            backLink.href =
                "deadlines.html?teamId=" + encodeURIComponent(teamId);
        }

        let statusKey = null;
        let ready = false;

        function showStatus(key) {
            statusKey = key;
            message.textContent = key ? i18next.t(key) : "";
        }

        function updateLanguage() {
            document.documentElement.lang = i18next.language;
            document.title = i18next.t("title");

            document.querySelectorAll("[data-i18n]").forEach(function(element) {
                const key = element.getAttribute("data-i18n");
                element.textContent = i18next.t(key);
            });

            backLink.textContent = "← " + i18next.t("back");
            languageSelector.value = i18next.language;

            if (statusKey) {
                message.textContent = i18next.t(statusKey);
            }
        }

        function saveLocalCopy(quality) {
            try {
                localStorage.setItem(
                    "qualityExpectations",
                    JSON.stringify(quality)
                );
            } catch (error) {
            }
        }

        async function getCurrentUser() {
            const { data, error } = await database.auth.getUser();

            if (error || !data.user) {
                throw new Error("NOT_SIGNED_IN");
            }

            return data.user;
        }

        async function loadQuality() {
            nextButton.disabled = true;
            showStatus("loading");

            if (!teamId) {
                showStatus("teamError");
                return;
            }

            try {
                const user = await getCurrentUser();

                const { data, error } = await database
                    .from("team_preferences")
                    .select("quality")
                    .eq("team_id", teamId)
                    .eq("user_id", user.id)
                    .maybeSingle();

                if (error) {
                    throw error;
                }

                const savedQuality = Array.isArray(data?.quality)
                    ? data.quality
                    : [];

                checkboxes.forEach(function(checkbox) {
                    checkbox.checked = savedQuality.includes(
                        checkbox.value
                    );
                });

                saveLocalCopy(savedQuality);

                ready = true;
                nextButton.disabled = false;
                showStatus(null);

            } catch (error) {
                if (error.message === "NOT_SIGNED_IN") {
                    showStatus("loginError");
                } else {
                    showStatus("loadError");
                }
            }
        }

        checkboxes.forEach(function(checkbox) {
            checkbox.addEventListener("change", function() {
                if (ready) {
                    showStatus(null);
                }
            });
        });

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!ready || nextButton.disabled) {
                return;
            }

            const selected = Array.from(
                document.querySelectorAll(
                    'input[name="quality"]:checked'
                )
            ).map(function(input) {
                return input.value;
            });

            if (selected.length === 0) {
                showStatus("requiredError");
                return;
            }

            nextButton.disabled = true;
            showStatus("saving");

            try {
                const user = await getCurrentUser();

                const { data: updated, error: updateError } = await database
                    .from("team_preferences")
                    .update({
                        quality: selected,
                        updated_at: new Date().toISOString()
                    })
                    .eq("team_id", teamId)
                    .eq("user_id", user.id)
                    .select("team_id");

                if (updateError) {
                    throw updateError;
                }

                if (!updated || updated.length === 0) {
                    const { error: insertError } = await database
                        .from("team_preferences")
                        .insert({
                            team_id: teamId,
                            user_id: user.id,
                            quality: selected
                        });

                    if (insertError) {
                        throw insertError;
                    }
                }

                saveLocalCopy(selected);

                window.location.href =
                    "comparison.html?teamId=" + encodeURIComponent(teamId);

            } catch (error) {
                showStatus(
                    error.message === "NOT_SIGNED_IN"
                        ? "loginError"
                        : "saveError"
                );

                nextButton.disabled = false;
            }
        });

        let savedLanguage = "en";

        try {
            savedLanguage = localStorage.getItem("appLanguage") || "en";
        } catch (error) {
            savedLanguage = "en";
        }

        if (!resources[savedLanguage]) {
            savedLanguage = "en";
        }

        i18next.init({
            lng: savedLanguage,
            fallbackLng: "en",
            supportedLngs: ["en", "hr", "sq"],
            resources: resources
        }).then(function() {
            updateLanguage();
            loadQuality();

            languageSelector.addEventListener("change", function() {
                const selectedLanguage = languageSelector.value;

                i18next.changeLanguage(selectedLanguage).then(function() {
                    try {
                        localStorage.setItem(
                            "appLanguage",
                            selectedLanguage
                        );
                    } catch (error) {
                    }

                    updateLanguage();
                });
            });
        });
    </script>
</body>
</html>
