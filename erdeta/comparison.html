<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Preference Comparison</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .back {
            color: #3458a4;
            text-decoration: none;
            font-size: 16px;
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #263b63;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        .notice {
            padding: 12px;
            background-color: #fff7e6;
            border: 1px solid #ead09a;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
            margin: 20px 0;
        }

        .comparison-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 17px;
            margin: 0;
            color: #263b63;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .same {
            background-color: #e1f5e8;
            color: #176b37;
        }

        .different {
            background-color: #fff0db;
            color: #8a4900;
        }

        .missing {
            background-color: #eeeeee;
            color: #555;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .choice {
            padding: 12px;
            background-color: #f4f6fb;
            border-radius: 8px;
            min-width: 0;
        }

        .choice strong {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #263b63;
        }

        .choice span {
            display: block;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #263b63;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        #message {
            color: #b42318;
            font-size: 14px;
        }

        @media (max-width: 450px) {
            .container {
                padding: 20px;
                margin: 15px auto;
            }

            .choices {
                gap: 8px;
            }

            .choice {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <a href="quality.html" class="back">
            ← Back
        </a>

        <h1>Preference Comparison</h1>

        <p>See how your preferences compare with your teammate's preferences.</p>

        <div class="notice">
            Demo comparison: The teammate's choices below are sample data.
            Real team preferences will be connected through the database.
        </div>

        <div id="comparisonResults"></div>

        <button type="button" id="nextButton">
            View Disagreements
        </button>

        <p id="message" role="status" aria-live="polite"></p>

    </main>

    <script>
        const results = document.getElementById("comparisonResults");
        const message = document.getElementById("message");

        function getSavedArray(key) {
            try {
                const value = JSON.parse(localStorage.getItem(key) || "[]");
                return Array.isArray(value) ? value : [];
            } catch (error) {
                return [];
            }
        }

        function getSavedText(key) {
            try {
                return localStorage.getItem(key) || "";
            } catch (error) {
                return "";
            }
        }

        function getAvailability() {
            try {
                const value = JSON.parse(
                    localStorage.getItem("weeklyAvailability") || "null"
                );

                if (!value) {
                    return [];
                }

                const times = Array.isArray(value.times)
                    ? value.times.map(function(time) {
                        return time.replace("-", " ");
                    })
                    : [];

                if (value.flexible === true) {
                    times.push("Flexible schedule");
                }

                return times;
            } catch (error) {
                return [];
            }
        }

        function sameChoices(first, second) {
            if (first.length === 0) {
                return false;
            }

            const a = [...new Set(first)].sort();
            const b = [...new Set(second)].sort();

            return JSON.stringify(a) === JSON.stringify(b);
        }

        const preferences = [
            {
                category: "Communication",
                mine: getSavedArray("communicationPreferences"),
                teammate: ["In-app Chat"]
            },
            {
                category: "Availability",
                mine: getAvailability(),
                teammate: ["Monday Morning", "Wednesday Evening"]
            },
            {
                category: "Preferred Roles",
                mine: getSavedArray("preferredRoles"),
                teammate: ["Development", "Testing"]
            },
            {
                category: "Deadlines",
                mine: getSavedText("deadlineExpectations")
                    ? [getSavedText("deadlineExpectations")]
                    : [],
                teammate: ["Strict deadlines"]
            },
            {
                category: "Quality",
                mine: getSavedArray("qualityExpectations"),
                teammate: ["Accuracy", "Clean work"]
            }
        ];

        const comparison = preferences.map(function(item) {
            let status = "Different";

            if (item.mine.length === 0) {
                status = "Not set";
            } else if (sameChoices(item.mine, item.teammate)) {
                status = "Same";
            }

            return {
                category: item.category,
                mine: item.mine,
                teammate: item.teammate,
                status: status
            };
        });

        comparison.forEach(function(item) {
            const card = document.createElement("section");
            card.className = "comparison-card";

            const header = document.createElement("div");
            header.className = "card-header";

            const title = document.createElement("h2");
            title.textContent = item.category;

            const status = document.createElement("span");
            status.className = "status";

            if (item.status === "Same") {
                status.classList.add("same");
            } else if (item.status === "Different") {
                status.classList.add("different");
            } else {
                status.classList.add("missing");
            }

            status.textContent = item.status;

            header.appendChild(title);
            header.appendChild(status);

            const choices = document.createElement("div");
            choices.className = "choices";

            const myChoice = document.createElement("div");
            myChoice.className = "choice";

            const myHeading = document.createElement("strong");
            myHeading.textContent = "Your choice";

            const myText = document.createElement("span");
            myText.textContent = item.mine.length
                ? item.mine.join(", ")
                : "Not selected";

            myChoice.appendChild(myHeading);
            myChoice.appendChild(myText);

            const teammateChoice = document.createElement("div");
            teammateChoice.className = "choice";

            const teammateHeading = document.createElement("strong");
            teammateHeading.textContent = "Example teammate";

            const teammateText = document.createElement("span");
            teammateText.textContent = item.teammate.join(", ");

            teammateChoice.appendChild(teammateHeading);
            teammateChoice.appendChild(teammateText);

            choices.appendChild(myChoice);
            choices.appendChild(teammateChoice);

            card.appendChild(header);
            card.appendChild(choices);

            results.appendChild(card);
        });

        document.getElementById("nextButton")
            .addEventListener("click", function() {

                try {
                    localStorage.setItem(
                        "groupComparison",
                        JSON.stringify(comparison)
                    );

                    window.location.href = "disagreements.html";

                } catch (error) {
                    message.textContent =
                        "Could not save the comparison. Please try again.";
                }
            });
    </script>

</body>
</html>
