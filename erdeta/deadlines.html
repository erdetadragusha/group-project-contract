
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline Expectations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            background: white;
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .back {
            color: #3458a4;
            text-decoration: none;
            font-size: 16px;
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #263b63;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 25px 0;
        }

        legend {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
        }

        .option:hover {
            background-color: #eef3ff;
        }

        .option:has(input:checked) {
            background-color: #eef3ff;
            border-color: #3458a4;
        }

        input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #3458a4;
            cursor: pointer;
            flex-shrink: 0;
        }

        .option-text {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .option-title {
            font-weight: bold;
            font-size: 16px;
        }

        .option-description {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #263b63;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        button:focus-visible,
        input:focus-visible,
        a:focus-visible,
        select:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        .language-box {
            margin: 20px 0;
        }

        .language-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .language-box select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        #message {
            margin-top: 15px;
            color: #b42318;
        }

        @media (max-width: 450px) {
            .container {
                padding: 20px;
                margin: 15px auto;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <a href="roles.html" class="back" id="backLink">
            ← Back
        </a>

        <div class="language-box">
            <label for="languageSelector" data-i18n="language">
                Language
            </label>
            <select id="languageSelector">
                <option value="en">English</option>
                <option value="hr">Hrvatski</option>
                <option value="sq">Shqip</option>
            </select>
        </div>

        <h1 data-i18n="title">Deadline Expectations</h1>

        <p data-i18n="question">
            How do you prefer to work with deadlines in your group project?
        </p>

        <form id="deadlinesForm">
            <fieldset>
                <legend data-i18n="instruction">
                    Choose your preferred deadline style:
                </legend>

                <label class="option">
                    <input
                        type="radio"
                        name="deadline"
                        value="Strict deadlines"
                    >

                    <span class="option-text">
                        <span class="option-title" data-i18n="strict">
                            Strict deadlines
                        </span>
                        <span class="option-description" data-i18n="strictDescription">
                            I prefer to finish tasks on time and follow fixed deadlines.
                        </span>
                    </span>
                </label>

                <label class="option">
                    <input
                        type="radio"
                        name="deadline"
                        value="Some flexibility"
                    >

                    <span class="option-text">
                        <span class="option-title" data-i18n="some">
                            Some flexibility
                        </span>
                        <span class="option-description" data-i18n="someDescription">
                            I prefer deadlines but can adjust them when needed.
                        </span>
                    </span>
                </label>

                <label class="option">
                    <input
                        type="radio"
                        name="deadline"
                        value="Flexible"
                    >

                    <span class="option-text">
                        <span class="option-title" data-i18n="flexible">
                            Flexible
                        </span>
                        <span class="option-description" data-i18n="flexibleDescription">
                            I prefer a flexible schedule with adjustable deadlines.
                        </span>
                    </span>
                </label>
            </fieldset>

            <button type="submit" id="nextButton" disabled data-i18n="next">
                Next
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../mateo/supabase-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.16.8/dist/umd/i18next.min.js"></script>

    <script>
        const resources = {
            en: {
                translation: {
                    title: "Deadline Expectations",
                    question: "How do you prefer to work with deadlines in your group project?",
                    instruction: "Choose your preferred deadline style:",
                    strict: "Strict deadlines",
                    strictDescription: "I prefer to finish tasks on time and follow fixed deadlines.",
                    some: "Some flexibility",
                    someDescription: "I prefer deadlines but can adjust them when needed.",
                    flexible: "Flexible",
                    flexibleDescription: "I prefer a flexible schedule with adjustable deadlines.",
                    back: "Back",
                    next: "Next",
                    language: "Language",
                    requiredError: "Please select your preferred deadline style.",
                    loadError: "Previous deadline preferences could not be loaded.",
                    saveError: "Could not save your deadline preference. Please try again.",
                    teamError: "Please open this page from your team.",
                    loginError: "Please sign in through the team setup first.",
                    loading: "Loading your deadline preference...",
                    saving: "Saving your deadline preference..."
                }
            },
            hr: {
                translation: {
                    title: "Očekivanja vezana uz rokove",
                    question: "Kako najradije radite s rokovima u grupnom projektu?",
                    instruction: "Odaberite način rada s rokovima:",
                    strict: "Strogi rokovi",
                    strictDescription: "Volim završavati zadatke na vrijeme i pridržavati se fiksnih rokova.",
                    some: "Određena fleksibilnost",
                    someDescription: "Volim imati rokove, ali ih mogu prilagoditi kada je potrebno.",
                    flexible: "Fleksibilni rokovi",
                    flexibleDescription: "Više mi odgovara fleksibilan raspored s prilagodljivim rokovima.",
                    back: "Natrag",
                    next: "Dalje",
                    language: "Jezik",
                    requiredError: "Odaberite način rada s rokovima.",
                    loadError: "Prethodne postavke rokova nije moguće učitati.",
                    saveError: "Postavku rokova nije moguće spremiti. Pokušajte ponovno.",
                    teamError: "Otvorite ovu stranicu iz svojeg tima.",
                    loginError: "Najprije se prijavite putem postavljanja tima.",
                    loading: "Učitavanje postavki rokova...",
                    saving: "Spremanje postavki rokova..."
                }
            },
            sq: {
                translation: {
                    title: "Pritshmëritë për afatet",
                    question: "Si preferoni të punoni me afatet në projektin tuaj në grup?",
                    instruction: "Zgjidhni mënyrën tuaj të preferuar të punës me afate:",
                    strict: "Afate të rrepta",
                    strictDescription: "Preferoj t'i përfundoj detyrat në kohë dhe t'i respektoj afatet e caktuara.",
                    some: "Pak fleksibilitet",
                    someDescription: "Preferoj të kem afate, por mund t'i ndryshoj kur është e nevojshme.",
                    flexible: "Afate fleksibile",
                    flexibleDescription: "Preferoj një orar fleksibil me afate që mund të ndryshohen.",
                    back: "Kthehu",
                    next: "Vazhdo",
                    language: "Gjuha",
                    requiredError: "Ju lutemi zgjidhni mënyrën e preferuar të punës me afate.",
                    loadError: "Preferencat e mëparshme për afatet nuk mund të ngarkohen.",
                    saveError: "Preferenca për afatet nuk u ruajt. Provoni përsëri.",
                    teamError: "Hapeni këtë faqe nga ekipi juaj.",
                    loginError: "Ju lutemi hyni fillimisht përmes ekipit.",
                    loading: "Duke ngarkuar preferencën për afatet...",
                    saving: "Duke ruajtur preferencën për afatet..."
                }
            }
        };

        const form = document.getElementById("deadlinesForm");
        const message = document.getElementById("message");
        const nextButton = document.getElementById("nextButton");
        const backLink = document.getElementById("backLink");
        const languageSelector = document.getElementById("languageSelector");

        const radioButtons = document.querySelectorAll(
            'input[name="deadline"]'
        );

        const teamId = new URLSearchParams(
            window.location.search
        ).get("teamId");

        if (teamId) {
            backLink.href =
                "roles.html?teamId=" + encodeURIComponent(teamId);
        }

        let statusKey = null;
        let ready = false;

        function showStatus(key) {
            statusKey = key;
            message.textContent = key ? i18next.t(key) : "";
        }

        function updateLanguage() {
            document.documentElement.lang = i18next.language;
            document.title = i18next.t("title");

            document.querySelectorAll("[data-i18n]").forEach(function(element) {
                const key = element.getAttribute("data-i18n");
                element.textContent = i18next.t(key);
            });

            backLink.textContent = "← " + i18next.t("back");
            languageSelector.value = i18next.language;

            if (statusKey) {
                message.textContent = i18next.t(statusKey);
            }
        }

        function saveLocalCopy(deadline) {
            try {
                localStorage.setItem("deadlineExpectations", deadline);
            } catch (error) {
            }
        }

        async function getCurrentUser() {
            const { data, error } = await database.auth.getUser();

            if (error || !data.user) {
                throw new Error("NOT_SIGNED_IN");
            }

            return data.user;
        }

        async function loadDeadline() {
            nextButton.disabled = true;
            showStatus("loading");

            if (!teamId) {
                showStatus("teamError");
                return;
            }

            try {
                const user = await getCurrentUser();

                const { data, error } = await database
                    .from("team_preferences")
                    .select("deadline")
                    .eq("team_id", teamId)
                    .eq("user_id", user.id)
                    .maybeSingle();

                if (error) {
                    throw error;
                }

                const savedDeadline = data?.deadline || "";

                radioButtons.forEach(function(radio) {
                    radio.checked = radio.value === savedDeadline;
                });

                saveLocalCopy(savedDeadline);

                ready = true;
                nextButton.disabled = false;
                showStatus(null);

            } catch (error) {
                if (error.message === "NOT_SIGNED_IN") {
                    showStatus("loginError");
                } else {
                    showStatus("loadError");
                }
            }
        }

        radioButtons.forEach(function(radio) {
            radio.addEventListener("change", function() {
                if (ready) {
                    showStatus(null);
                }
            });
        });

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!ready || nextButton.disabled) {
                return;
            }

            const selected = document.querySelector(
                'input[name="deadline"]:checked'
            );

            if (!selected) {
                showStatus("requiredError");
                return;
            }

            nextButton.disabled = true;
            showStatus("saving");

            try {
                const user = await getCurrentUser();

                const { data: updated, error: updateError } = await database
                    .from("team_preferences")
                    .update({
                        deadline: selected.value,
                        updated_at: new Date().toISOString()
                    })
                    .eq("team_id", teamId)
                    .eq("user_id", user.id)
                    .select("team_id");

                if (updateError) {
                    throw updateError;
                }

                if (!updated || updated.length === 0) {
                    const { error: insertError } = await database
                        .from("team_preferences")
                        .insert({
                            team_id: teamId,
                            user_id: user.id,
                            deadline: selected.value
                        });

                    if (insertError) {
                        throw insertError;
                    }
                }

                saveLocalCopy(selected.value);

                window.location.href =
                    "quality.html?teamId=" + encodeURIComponent(teamId);

            } catch (error) {
                showStatus(
                    error.message === "NOT_SIGNED_IN"
                        ? "loginError"
                        : "saveError"
                );

                nextButton.disabled = false;
            }
        });

        let savedLanguage = "en";

        try {
            savedLanguage = localStorage.getItem("appLanguage") || "en";
        } catch (error) {
            savedLanguage = "en";
        }

        if (!resources[savedLanguage]) {
            savedLanguage = "en";
        }

        i18next.init({
            lng: savedLanguage,
            fallbackLng: "en",
            supportedLngs: ["en", "hr", "sq"],
            resources: resources
        }).then(function() {
            updateLanguage();
            loadDeadline();

            languageSelector.addEventListener("change", function() {
                const selectedLanguage = languageSelector.value;

                i18next.changeLanguage(selectedLanguage).then(function() {
                    try {
                        localStorage.setItem(
                            "appLanguage",
                            selectedLanguage
                        );
                    } catch (error) {
                    }

                    updateLanguage();
                });
            });
        });
    </script>
</body>
</html>
