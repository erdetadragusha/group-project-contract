<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disagreement Overview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .back {
            color: #3458a4;
            text-decoration: none;
            font-size: 16px;
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #263b63;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        .notice {
            padding: 12px;
            margin: 20px 0;
            background-color: #fff7e6;
            border: 1px solid #ead09a;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 25px 0;
        }

        legend {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .option {
            display: block;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .option:hover {
            background-color: #eef3ff;
        }

        .option:has(input:checked) {
            background-color: #eef3ff;
            border-color: #3458a4;
        }

        .option-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #3458a4;
            cursor: pointer;
            flex-shrink: 0;
        }

        .option-title {
            font-weight: bold;
            color: #263b63;
            font-size: 17px;
        }

        .badge {
            margin-left: auto;
            padding: 5px 9px;
            background-color: #fff0db;
            color: #8a4900;
            border-radius: 20px;
            font-size: 12px;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .choice {
            background-color: #f4f6fb;
            padding: 12px;
            border-radius: 8px;
            min-width: 0;
        }

        .choice strong {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .choice span {
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #263b63;
        }

        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        button:focus-visible,
        input:focus-visible,
        a:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        #message {
            margin-top: 15px;
            color: #b42318;
        }

        .empty {
            padding: 20px;
            background-color: #eef3ff;
            border-radius: 10px;
            text-align: center;
            line-height: 1.6;
        }

        @media (max-width: 450px) {
            .container {
                padding: 20px;
                margin: 15px auto;
            }

            .choices {
                gap: 8px;
            }

            .choice {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <a href="comparison.html" class="back">
            ← Back
        </a>

        <h1>Disagreement Overview</h1>

        <p>
            These are the areas where you and your teammate
            have different preferences.
        </p>

        <div class="notice">
            Demo mode: Teammate preferences are examples.
            Real team data will be connected later.
        </div>

        <form id="disagreementForm">

            <fieldset>
                <legend>Choose a disagreement to discuss:</legend>

                <div id="disagreementList"></div>
            </fieldset>

            <button type="submit" id="proposalButton">
                Create Proposal
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

    </main>

    <script>
        const form = document.getElementById("disagreementForm");
        const list = document.getElementById("disagreementList");
        const message = document.getElementById("message");
        const button = document.getElementById("proposalButton");

        let comparison = [];

        try {
            const saved = JSON.parse(
                localStorage.getItem("groupComparison") || "[]"
            );

            if (Array.isArray(saved)) {
                comparison = saved;
            }

        } catch (error) {
            message.textContent =
                "Comparison information could not be loaded.";
        }

        const disagreements = comparison.filter(function(item) {
            return item &&
                item.status === "Different" &&
                typeof item.category === "string";
        });

        function createChoice(heading, values) {
            const box = document.createElement("div");
            box.className = "choice";

            const title = document.createElement("strong");
            title.textContent = heading;

            const text = document.createElement("span");
            text.textContent = Array.isArray(values)
                ? values.join(", ")
                : "Not available";

            box.appendChild(title);
            box.appendChild(text);

            return box;
        }

        disagreements.forEach(function(item) {

            const label = document.createElement("label");
            label.className = "option";

            const header = document.createElement("div");
            header.className = "option-header";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "disagreement";
            radio.value = item.category;

            const title = document.createElement("span");
            title.className = "option-title";
            title.textContent = item.category;

            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = "Different";

            header.appendChild(radio);
            header.appendChild(title);
            header.appendChild(badge);

            const choices = document.createElement("div");
            choices.className = "choices";

            choices.appendChild(
                createChoice("Your choice", item.mine)
            );

            choices.appendChild(
                createChoice("Example teammate", item.teammate)
            );

            label.appendChild(header);
            label.appendChild(choices);

            list.appendChild(label);
        });

        if (comparison.length === 0) {

            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent =
                "No comparison found. Go back to Screen 6 and select View Disagreements.";

            list.appendChild(empty);
            button.disabled = true;

        } else if (disagreements.length === 0) {

            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent =
                "No disagreements found! Your selected preferences match the example teammate.";

            list.appendChild(empty);
            button.disabled = true;

        }

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const selected = document.querySelector(
                'input[name="disagreement"]:checked'
            );

            if (!selected) {
                message.textContent =
                    "Please select a disagreement first.";
                return;
            }

            try {
                localStorage.setItem(
                    "selectedDisagreement",
                    selected.value
                );

                window.location.href = "proposal.html";

            } catch (error) {
                message.textContent =
                    "Could not save your selection. Please try again.";
            }
        });
    </script>
<script src="https://cdn.jsdelivr.net/npm/i18next@23.16.8/dist/umd/i18next.min.js"></script>

                emptyComparison: "Nuk u gjet asnjë krahasim. Kthehuni te ekrani 6 dhe zgjidhni Shiko mospajtimet.",

                },
                values: {
                    Email: "Email",
                    "In-app Chat": "Bisedë në aplikacion",
                    Discord: "Discord",
                    "Zoom / Meet": "Zoom / Meet",

                    Design: "Dizajn",
                    Development: "Zhvillim",
                    Testing: "Testim",
                    Documentation: "Dokumentim",
                    "Strict deadlines": "Afate të rrepta",
                    "Some flexibility": "Pak fleksibilitet",
                    Flexible: "Afate fleksibile",
                    Accuracy: "Saktësia",
                    "Good design / usability": "Dizajn i mirë / lehtësi në përdorim",
                    "Clean work": "Punë e rregullt",
                    "Detailed documentation": "Dokumentim i detajuar",
                    "Flexible schedule": "Orar fleksibil"
                },
                days: {
                    Monday: "E hënë",
                    Tuesday: "E martë",
                    Wednesday: "E mërkurë",
                    Thursday: "E enjte",
                    Friday: "E premte",
                    Saturday: "E shtunë",
                    Sunday: "E diel"
                },
                periods: {
                    Morning: "Mëngjes",
                    Afternoon: "Pasdite",
                    Evening: "Mbrëmje"
                }
            }

    };

    const main = document.querySelector(".container");
    const heading = main.querySelector("h1");
    const description = main.querySelector("p");
    const notice = main.querySelector(".notice");
    const legend = main.querySelector("legend");
    const backLink = main.querySelector(".back");
    const proposalButton = document.getElementById("proposalButton");
    const messageElement = document.getElementById("message");

    const languageBox = document.createElement("div");
    languageBox.style.margin = "20px 0";

    const languageLabel = document.createElement("label");
    languageLabel.htmlFor = "languageSelector";
    languageLabel.style.display = "block";
    languageLabel.style.marginBottom = "8px";
    languageLabel.style.fontWeight = "bold";

    const languageSelector = document.createElement("select");
    languageSelector.id = "languageSelector";
    languageSelector.style.width = "100%";
    languageSelector.style.padding = "12px";
    languageSelector.style.border = "1px solid #ccc";
    languageSelector.style.borderRadius = "10px";
    languageSelector.style.fontSize = "15px";

    [
        ["en", "English"],
        ["hr", "Hrvatski"],
        ["sq", "Shqip"]
    ].forEach(function (entry) {
        const option = document.createElement("option");
        option.value = entry[0];
        option.textContent = entry[1];
        languageSelector.appendChild(option);
    });

    languageBox.appendChild(languageLabel);
    languageBox.appendChild(languageSelector);
    main.insertBefore(languageBox, heading);

    const errorKeys = {
        "Comparison information could not be loaded.": "loadError",
        "Please select a disagreement first.": "selectError",
        "Could not save your selection. Please try again.": "saveError"
    };

    let currentError = null;

    function translateCategory(category) {
        const translations = resources[i18next.language].translation.categories;
        return translations[category] || category;
    }

    function translateValue(value) {
        const t = resources[i18next.language].translation;

        if (t.values[value]) {
            return t.values[value];
        }

        const parts = value.split(" ");

        if (parts.length === 2 &&
            t.days[parts[0]] &&
            t.periods[parts[1]]) {
            return t.days[parts[0]] + " — " + t.periods[parts[1]];
        }

        return value;
    }

    function translateChoices(values) {
        if (!Array.isArray(values)) {
            return i18next.t("notAvailable");
        }

        return values.map(translateValue).join(", ") ||
            i18next.t("notAvailable");
    }

    function updateText() {
        document.documentElement.lang = i18next.language;
        document.title = i18next.t("title");

        heading.textContent = i18next.t("title");
        description.textContent = i18next.t("description");
        notice.textContent = i18next.t("notice");
        legend.textContent = i18next.t("instruction");
        backLink.textContent = "← " + i18next.t("back");
        proposalButton.textContent = i18next.t("next");
        languageLabel.textContent = i18next.t("language");

        const options = document.querySelectorAll("#disagreementList .option");

        options.forEach(function (option, index) {
            const item = disagreements[index];

            if (!item) return;

            option.querySelector(".option-title").textContent =
                translateCategory(item.category);

            option.querySelector(".badge").textContent =
                i18next.t("different");

            const headings = option.querySelectorAll(".choice strong");
            const texts = option.querySelectorAll(".choice span");

            headings[0].textContent = i18next.t("yourChoice");
            headings[1].textContent = i18next.t("teammate");

            texts[0].textContent = translateChoices(item.mine);
            texts[1].textContent = translateChoices(item.teammate);
        });

        const empty = document.querySelector("#disagreementList .empty");

        if (empty) {
            empty.textContent = comparison.length === 0
                ? i18next.t("emptyComparison")
                : i18next.t("emptyDisagreements");
        }

        if (currentError) {
            messageElement.textContent = i18next.t(currentError);
        }
    }

    const observer = new MutationObserver(function () {
        const text = messageElement.textContent.trim();

        if (!text) {
            currentError = null;
            return;
        }

        if (errorKeys[text]) {
            currentError = errorKeys[text];
        }

        if (currentError) {
            const translated = i18next.t(currentError);

            if (text !== translated) {
                messageElement.textContent = translated;
            }
        }
    });

    let savedLanguage = "en";

    try {
        savedLanguage = localStorage.getItem("appLanguage") || "en";
    } catch (error) {
        savedLanguage = "en";
    }

    if (!resources[savedLanguage]) {
        savedLanguage = "en";
    }

    i18next.init({
        lng: savedLanguage,
        fallbackLng: "en",
        resources: resources
    }).then(function () {
        languageSelector.value = savedLanguage;

        observer.observe(messageElement, {
            childList: true,
            characterData: true,
            subtree: true
        });

        if (errorKeys[messageElement.textContent.trim()]) {
            currentError = errorKeys[messageElement.textContent.trim()];
        }

        updateText();

        languageSelector.addEventListener("change", function () {
            const selectedLanguage = languageSelector.value;

            i18next.changeLanguage(selectedLanguage).then(function () {
                try {
                    localStorage.setItem("appLanguage", selectedLanguage);
                } catch (error) {
                }

                updateText();
            });
        });
    });
})();
