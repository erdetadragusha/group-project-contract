<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disagreement Overview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .back {
            color: #3458a4;
            text-decoration: none;
            font-size: 16px;
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #263b63;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        .notice {
            padding: 12px;
            margin: 20px 0;
            background-color: #fff7e6;
            border: 1px solid #ead09a;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 25px 0;
        }

        legend {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .option {
            display: block;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .option:hover {
            background-color: #eef3ff;
        }

        .option:has(input:checked) {
            background-color: #eef3ff;
            border-color: #3458a4;
        }

        .option-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #3458a4;
            cursor: pointer;
            flex-shrink: 0;
        }

        .option-title {
            font-weight: bold;
            color: #263b63;
            font-size: 17px;
        }

        .badge {
            margin-left: auto;
            padding: 5px 9px;
            background-color: #fff0db;
            color: #8a4900;
            border-radius: 20px;
            font-size: 12px;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .choice {
            background-color: #f4f6fb;
            padding: 12px;
            border-radius: 8px;
            min-width: 0;
        }

        .choice strong {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .choice span {
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #263b63;
        }

        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        button:focus-visible,
        input:focus-visible,
        a:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        #message {
            margin-top: 15px;
            color: #b42318;
        }

        .empty {
            padding: 20px;
            background-color: #eef3ff;
            border-radius: 10px;
            text-align: center;
            line-height: 1.6;
        }

        @media (max-width: 450px) {
            .container {
                padding: 20px;
                margin: 15px auto;
            }

            .choices {
                gap: 8px;
            }

            .choice {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <a href="comparison.html" class="back">
            ← Back
        </a>

        <h1>Disagreement Overview</h1>

        <p>
            These are the areas where you and your teammate
            have different preferences.
        </p>

        <div class="notice">
            Demo mode: Teammate preferences are examples.
            Real team data will be connected later.
        </div>

        <form id="disagreementForm">

            <fieldset>
                <legend>Choose a disagreement to discuss:</legend>

                <div id="disagreementList"></div>
            </fieldset>

            <button type="submit" id="proposalButton">
                Create Proposal
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

    </main>

    <script>
        const form = document.getElementById("disagreementForm");
        const list = document.getElementById("disagreementList");
        const message = document.getElementById("message");
        const button = document.getElementById("proposalButton");

        let comparison = [];

        try {
            const saved = JSON.parse(
                localStorage.getItem("groupComparison") || "[]"
            );

            if (Array.isArray(saved)) {
                comparison = saved;
            }

        } catch (error) {
            message.textContent =
                "Comparison information could not be loaded.";
        }

        const disagreements = comparison.filter(function(item) {
            return item &&
                item.status === "Different" &&
                typeof item.category === "string";
        });

        function createChoice(heading, values) {
            const box = document.createElement("div");
            box.className = "choice";

            const title = document.createElement("strong");
            title.textContent = heading;

            const text = document.createElement("span");
            text.textContent = Array.isArray(values)
                ? values.join(", ")
                : "Not available";

            box.appendChild(title);
            box.appendChild(text);

            return box;
        }

        disagreements.forEach(function(item) {

            const label = document.createElement("label");
            label.className = "option";

            const header = document.createElement("div");
            header.className = "option-header";

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "disagreement";
            radio.value = item.category;

            const title = document.createElement("span");
            title.className = "option-title";
            title.textContent = item.category;

            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = "Different";

            header.appendChild(radio);
            header.appendChild(title);
            header.appendChild(badge);

            const choices = document.createElement("div");
            choices.className = "choices";

            choices.appendChild(
                createChoice("Your choice", item.mine)
            );

            choices.appendChild(
                createChoice("Example teammate", item.teammate)
            );

            label.appendChild(header);
            label.appendChild(choices);

            list.appendChild(label);
        });

        if (comparison.length === 0) {

            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent =
                "No comparison found. Go back to Screen 6 and select View Disagreements.";

            list.appendChild(empty);
            button.disabled = true;

        } else if (disagreements.length === 0) {

            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent =
                "No disagreements found! Your selected preferences match the example teammate.";

            list.appendChild(empty);
            button.disabled = true;

        }

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const selected = document.querySelector(
                'input[name="disagreement"]:checked'
            );

            if (!selected) {
                message.textContent =
                    "Please select a disagreement first.";
                return;
            }

            try {
                localStorage.setItem(
                    "selectedDisagreement",
                    selected.value
                );

                window.location.href = "proposal.html";

            } catch (error) {
                message.textContent =
                    "Could not save your selection. Please try again.";
            }
        });
    </script>

</body>
</html>
