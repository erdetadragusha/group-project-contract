
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferred Roles</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            background: white;
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .back {
            color: #3458a4;
            text-decoration: none;
            font-size: 16px;
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #263b63;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 25px 0;
        }

        legend {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
        }

        .option:hover {
            background-color: #eef3ff;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #3458a4;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #263b63;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        button:focus-visible,
        input:focus-visible,
        a:focus-visible,
        select:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        .language-box {
            margin: 20px 0;
        }

        .language-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .language-box select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        #message {
            margin-top: 15px;
            color: #b42318;
        }

        @media (max-width: 450px) {
            .container {
                padding: 20px;
                margin: 15px auto;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <a href="availability.html" class="back" id="backLink">
            ← Back
        </a>

        <div class="language-box">
            <label for="languageSelector" data-i18n="language">
                Language
            </label>
            <select id="languageSelector">
                <option value="en">English</option>
                <option value="hr">Hrvatski</option>
                <option value="sq">Shqip</option>
            </select>
        </div>

        <h1 data-i18n="title">Preferred Roles</h1>

        <p data-i18n="question">
            Which roles would you like to have in your group project?
        </p>

        <form id="rolesForm">
            <fieldset>
                <legend data-i18n="instruction">
                    Select up to 3 roles:
                </legend>

                <label class="option">
                    <input type="checkbox" name="role" value="Research">
                    <span data-i18n="research">Research</span>
                </label>

                <label class="option">
                    <input type="checkbox" name="role" value="Design">
                    <span data-i18n="design">Design</span>
                </label>

                <label class="option">
                    <input type="checkbox" name="role" value="Development">
                    <span data-i18n="development">Development</span>
                </label>

                <label class="option">
                    <input type="checkbox" name="role" value="Testing">
                    <span data-i18n="testing">Testing</span>
                </label>

                <label class="option">
                    <input type="checkbox" name="role" value="Documentation">
                    <span data-i18n="documentation">Documentation</span>
                </label>

                <label class="option">
                    <input type="checkbox" name="role" value="Other">
                    <span data-i18n="other">Other</span>
                </label>
            </fieldset>

            <button type="submit" id="nextButton" disabled data-i18n="next">
                Next
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../mateo/supabase-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.16.8/dist/umd/i18next.min.js"></script>

    <script>
        const resources = {
            en: {
                translation: {
                    title: "Preferred Roles",
                    question: "Which roles would you like to have in your group project?",
                    instruction: "Select up to 3 roles:",
                    research: "Research",
                    design: "Design",
                    development: "Development",
                    testing: "Testing",
                    documentation: "Documentation",
                    other: "Other",
                    back: "Back",
                    next: "Next",
                    language: "Language",
                    requiredError: "Please select at least one role.",
                    limitError: "You can select a maximum of 3 roles.",
                    loadError: "Previous roles could not be loaded.",
                    saveError: "Could not save roles. Please try again.",
                    teamError: "Please open this page from your team.",
                    loginError: "Please sign in through the team setup first.",
                    loading: "Loading your roles...",
                    saving: "Saving your roles..."
                }
            },
            hr: {
                translation: {
                    title: "Željene uloge",
                    question: "Koje biste uloge željeli imati u grupnom projektu?",
                    instruction: "Odaberite najviše 3 uloge:",
                    research: "Istraživanje",
                    design: "Dizajn",
                    development: "Razvoj",
                    testing: "Testiranje",
                    documentation: "Dokumentacija",
                    other: "Ostalo",
                    back: "Natrag",
                    next: "Dalje",
                    language: "Jezik",
                    requiredError: "Odaberite barem jednu ulogu.",
                    limitError: "Možete odabrati najviše 3 uloge.",
                    loadError: "Prethodne uloge nije moguće učitati.",
                    saveError: "Uloge nije moguće spremiti. Pokušajte ponovno.",
                    teamError: "Otvorite ovu stranicu iz svojeg tima.",
                    loginError: "Najprije se prijavite putem postavljanja tima.",
                    loading: "Učitavanje vaših uloga...",
                    saving: "Spremanje vaših uloga..."
                }
            },
            sq: {
                translation: {
                    title: "Rolet e preferuara",
                    question: "Cilat role dëshironi të keni në projektin në grup?",
                    instruction: "Zgjidhni deri në 3 role:",
                    research: "Hulumtim",
                    design: "Dizajn",
                    development: "Zhvillim",
                    testing: "Testim",
                    documentation: "Dokumentim",
                    other: "Tjetër",
                    back: "Kthehu",
                    next: "Vazhdo",
                    language: "Gjuha",
                    requiredError: "Ju lutemi zgjidhni të paktën një rol.",
                    limitError: "Mund të zgjidhni maksimumi 3 role.",
                    loadError: "Rolet e mëparshme nuk mund të ngarkohen.",
                    saveError: "Rolet nuk u ruajtën. Provoni përsëri.",
                    teamError: "Hapeni këtë faqe nga ekipi juaj.",
                    loginError: "Ju lutemi hyni fillimisht përmes ekipit.",
                    loading: "Duke ngarkuar rolet tuaja...",
                    saving: "Duke ruajtur rolet tuaja..."
                }
            }
        };

        const form = document.getElementById("rolesForm");
        const message = document.getElementById("message");
        const nextButton = document.getElementById("nextButton");
        const backLink = document.getElementById("backLink");
        const languageSelector = document.getElementById("languageSelector");
        const checkboxes = document.querySelectorAll('input[name="role"]');

        const teamId = new URLSearchParams(
            window.location.search
        ).get("teamId");

        if (teamId) {
            backLink.href =
                "availability.html?teamId=" + encodeURIComponent(teamId);
        }

        let statusKey = null;
        let ready = false;

        function showStatus(key) {
            statusKey = key;
            message.textContent = key ? i18next.t(key) : "";
        }

        function updateLanguage() {
            document.documentElement.lang = i18next.language;
            document.title = i18next.t("title");

            document.querySelectorAll("[data-i18n]").forEach(function(element) {
                const key = element.getAttribute("data-i18n");
                element.textContent = i18next.t(key);
            });

            backLink.textContent = "← " + i18next.t("back");

            languageSelector.value = i18next.language;

            if (statusKey) {
                message.textContent = i18next.t(statusKey);
            }
        }

        function saveLocalCopy(roles) {
            try {
                localStorage.setItem(
                    "preferredRoles",
                    JSON.stringify(roles)
                );
            } catch (error) {
            }
        }

        async function getCurrentUser() {
            const { data, error } = await database.auth.getUser();

            if (error || !data.user) {
                throw new Error("NOT_SIGNED_IN");
            }

            return data.user;
        }

        async function loadRoles() {
            nextButton.disabled = true;
            showStatus("loading");

            if (!teamId) {
                showStatus("teamError");
                return;
            }

            try {
                const user = await getCurrentUser();

                const { data, error } = await database
                    .from("team_preferences")
                    .select("roles")
                    .eq("team_id", teamId)
                    .eq("user_id", user.id)
                    .maybeSingle();

                if (error) {
                    throw error;
                }

                const savedRoles = Array.isArray(data?.roles)
                    ? data.roles.slice(0, 3)
                    : [];

                checkboxes.forEach(function(checkbox) {
                    checkbox.checked = savedRoles.includes(checkbox.value);
                });

                saveLocalCopy(savedRoles);

                ready = true;
                nextButton.disabled = false;
                showStatus(null);

            } catch (error) {
                if (error.message === "NOT_SIGNED_IN") {
                    showStatus("loginError");
                } else {
                    showStatus("loadError");
                }
            }
        }

        checkboxes.forEach(function(checkbox) {
            checkbox.addEventListener("change", function() {
                const selected = document.querySelectorAll(
                    'input[name="role"]:checked'
                );

                if (selected.length > 3) {
                    checkbox.checked = false;
                    showStatus("limitError");
                } else if (ready) {
                    showStatus(null);
                }
            });
        });

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!ready || nextButton.disabled) {
                return;
            }

            const selected = Array.from(
                document.querySelectorAll('input[name="role"]:checked')
            ).map(function(input) {
                return input.value;
            });

            if (selected.length === 0) {
                showStatus("requiredError");
                return;
            }

            if (selected.length > 3) {
                showStatus("limitError");
                return;
            }

            nextButton.disabled = true;
            showStatus("saving");

            try {
                const user = await getCurrentUser();

                const { data: updated, error: updateError } = await database
                    .from("team_preferences")
                    .update({
                        roles: selected,
                        updated_at: new Date().toISOString()
                    })
                    .eq("team_id", teamId)
                    .eq("user_id", user.id)
                    .select("team_id");

                if (updateError) {
                    throw updateError;
                }

                if (!updated || updated.length === 0) {
                    const { error: insertError } = await database
                        .from("team_preferences")
                        .insert({
                            team_id: teamId,
                            user_id: user.id,
                            roles: selected
                        });

                    if (insertError) {
                        throw insertError;
                    }
                }

                saveLocalCopy(selected);

                window.location.href =
                    "deadlines.html?teamId=" + encodeURIComponent(teamId);

            } catch (error) {
                showStatus(
                    error.message === "NOT_SIGNED_IN"
                        ? "loginError"
                        : "saveError"
                );

                nextButton.disabled = false;
            }
        });

        let savedLanguage = "en";

        try {
            savedLanguage = localStorage.getItem("appLanguage") || "en";
        } catch (error) {
            savedLanguage = "en";
        }

        if (!resources[savedLanguage]) {
            savedLanguage = "en";
        }

        i18next.init({
            lng: savedLanguage,
            fallbackLng: "en",
            supportedLngs: ["en", "hr", "sq"],
            resources: resources
        }).then(function() {
            updateLanguage();
            loadRoles();

            languageSelector.addEventListener("change", function() {
                const selectedLanguage = languageSelector.value;

                i18next.changeLanguage(selectedLanguage).then(function() {
                    try {
                        localStorage.setItem(
                            "appLanguage",
                            selectedLanguage
                        );
                    } catch (error) {
                    }

                    updateLanguage();
                });
            });
        });
    </script>
</body>
</html>
