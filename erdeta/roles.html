<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Preferred Roles</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            background: white;
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .back {
            color: #3458a4;
            text-decoration: none;
            font-size: 16px;
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #263b63;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.5;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 25px 0;
        }

        legend {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
        }

        .option:hover {
            background-color: #eef3ff;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #3458a4;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #263b63;
        }

        button:focus-visible,
        input:focus-visible,
        a:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        #message {
            margin-top: 15px;
            color: #b42318;
        }

        @media (max-width: 450px) {
            .container {
                padding: 20px;
                margin: 15px auto;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <a href="availability.html" class="back">
            ← Back
        </a>

        <h1>Preferred Roles</h1>

        <p>Which roles would you like to have in your group project?</p>

        <form id="rolesForm">

            <fieldset>

                <legend>Select up to 3 roles:</legend>

                <label class="option">
                    <input type="checkbox" name="role" value="Research">
                    Research
                </label>

                <label class="option">
                    <input type="checkbox" name="role" value="Design">
                    Design
                </label>

                <label class="option">
                    <input type="checkbox" name="role" value="Development">
                    Development
                </label>

                <label class="option">
                    <input type="checkbox" name="role" value="Testing">
                    Testing
                </label>

                <label class="option">
                    <input type="checkbox" name="role" value="Documentation">
                    Documentation
                </label>

                <label class="option">
                    <input type="checkbox" name="role" value="Other">
                    Other
                </label>

            </fieldset>

            <button type="submit">Next</button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

    </main>

    <script>
        const form = document.getElementById("rolesForm");
        const message = document.getElementById("message");
        const checkboxes = document.querySelectorAll('input[name="role"]');

        try {
            const savedRoles = JSON.parse(
                localStorage.getItem("preferredRoles") || "[]"
            );

            if (Array.isArray(savedRoles)) {
                checkboxes.forEach(function(checkbox) {
                    checkbox.checked = savedRoles
                        .slice(0, 3)
                        .includes(checkbox.value);
                });
            }
        } catch (error) {
            message.textContent = "Previous roles could not be loaded.";
        }

        checkboxes.forEach(function(checkbox) {

            checkbox.addEventListener("change", function() {

                const selected = document.querySelectorAll(
                    'input[name="role"]:checked'
                );

                if (selected.length > 3) {
                    checkbox.checked = false;
                    message.style.color = "#b42318";
                    message.textContent =
                        "You can select a maximum of 3 roles.";
                } else {
                    message.textContent = "";
                }

            });

        });

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const selected = Array.from(
                document.querySelectorAll(
                    'input[name="role"]:checked'
                )
            ).map(function(input) {
                return input.value;
            });

            if (selected.length === 0) {
                message.style.color = "#b42318";
                message.textContent =
                    "Please select at least one role.";
                return;
            }

            if (selected.length > 3) {
                message.style.color = "#b42318";
                message.textContent =
                    "You can select a maximum of 3 roles.";
                return;
            }

            try {
                localStorage.setItem(
                    "preferredRoles",
                    JSON.stringify(selected)
                );

                message.style.color = "#167347";
                message.textContent =
                    "Roles saved! The next screen will be connected soon.";

            } catch (error) {
                message.style.color = "#b42318";
                message.textContent =
                    "Could not save roles. Please try again.";
            }

        });
    </script>

</body>
</html>
