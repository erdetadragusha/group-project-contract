<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Communication Preferences</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            background: white;
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #263b63;
        }

        p {
            text-align: center;
            color: #555;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 25px 0;
        }

        legend {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
        }

        .option:hover {
            background-color: #eef3ff;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #3458a4;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #263b63;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        #message {
            margin-top: 15px;
            color: #b42318;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Communication Preferences</h1>

        <p>How do you prefer to communicate with your team?</p>

        <form id="preferencesForm">

            <fieldset>
                <legend>Select your preferred options:</legend>

                <label class="option">
                    <input
                        type="checkbox"
                        name="communication"
                        value="Email"
                    >
                    Email
                </label>

                <label class="option">
                    <input
                        type="checkbox"
                        name="communication"
                        value="In-app Chat"
                    >
                    In-app Chat
                </label>

                <label class="option">
                    <input
                        type="checkbox"
                        name="communication"
                        value="Discord"
                    >
                    Discord
                </label>

                <label class="option">
                    <input
                        type="checkbox"
                        name="communication"
                        value="Zoom / Meet"
                    >
                    Zoom / Meet
                </label>

                <label class="option">
                    <input
                        type="checkbox"
                        name="communication"
                        value="Other"
                    >
                    Other
                </label>

            </fieldset>

            <button type="submit">Next</button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

    </main>

    <script>

        // Get the form and message area
        const form = document.getElementById("preferencesForm");
        const message = document.getElementById("message");

        // Load previously saved preferences
        try {
            const savedPreferences = JSON.parse(
                localStorage.getItem("communicationPreferences") || "[]"
            );

            if (Array.isArray(savedPreferences)) {
                document.querySelectorAll(
                    'input[name="communication"]'
                ).forEach(function(input) {

                    if (savedPreferences.includes(input.value)) {
                        input.checked = true;
                    }

                });
            }

        } catch (error) {
            message.textContent =
                "Previous preferences could not be loaded.";
        }

        // Handle the Next button
        form.addEventListener("submit", function(event) {

            event.preventDefault();

            // Get selected communication options
            const selected = Array.from(
                document.querySelectorAll(
                    'input[name="communication"]:checked'
                )
            ).map(function(input) {
                return input.value;
            });

            // Make sure at least one option is selected
            if (selected.length === 0) {

                message.textContent =
                    "Please select at least one communication option.";

                return;
            }

            // Save the selected preferences
            try {

                localStorage.setItem(
                    "communicationPreferences",
                    JSON.stringify(selected)
                );

                // Open Screen 2: Weekly Availability
                window.location.href = "availability.html";

            } catch (error) {

                message.textContent =
                    "Could not save your preferences. Please try again.";

            }

        });

    </script>
<script src="https://cdn.jsdelivr.net/npm/i18next@23.16.8/dist/umd/i18next.min.js"></script>

<script>
(function () {
    if (!window.i18next) return;

    const resources = {
        en: {
            translation: {
                title: "Communication Preferences",
                question: "How do you prefer to communicate with your team?",
                instruction: "Select your preferred options:",
                email: "Email",
                chat: "In-app Chat",
                discord: "Discord",
                zoom: "Zoom / Meet",
                other: "Other",
                next: "Next",
                language: "Language",
                selectError: "Please select at least one communication option.",
                loadError: "Previous preferences could not be loaded.",
                saveError: "Could not save your preferences. Please try again."
            }
        },
        hr: {
            translation: {
                title: "Komunikacijske postavke",
                question: "Kako najradije komunicirate sa svojim timom?",
                instruction: "Odaberite željene mogućnosti:",
                email: "E-pošta",
                chat: "Razgovor u aplikaciji",
                discord: "Discord",
                zoom: "Zoom / Meet",
                other: "Ostalo",
                next: "Dalje",
                language: "Jezik",
                selectError: "Odaberite barem jednu mogućnost komunikacije.",
                loadError: "Prethodne postavke nije moguće učitati.",
                saveError: "Postavke nije moguće spremiti. Pokušajte ponovno."
            }
        },
        sq: {
            translation: {
                title: "Preferencat e komunikimit",
                question: "Si preferoni të komunikoni me ekipin tuaj?",
                instruction: "Zgjidhni mënyrat që preferoni:",
                email: "Email",
                chat: "Bisedë në aplikacion",
                discord: "Discord",
                zoom: "Zoom / Meet",
                other: "Tjetër",
                next: "Vazhdo",
                language: "Gjuha",
                selectError: "Ju lutemi zgjidhni të paktën një mënyrë komunikimi.",
                loadError: "Preferencat e mëparshme nuk mund të ngarkohen.",
                saveError: "Preferencat nuk u ruajtën. Provoni përsëri."
            }
        }
    };

    const main = document.querySelector(".container");
    const heading = main.querySelector("h1");
    const question = main.querySelector("p");
    const legend = main.querySelector("legend");
    const options = main.querySelectorAll(".option");
    const nextButton = main.querySelector('button[type="submit"]');
    const message = document.getElementById("message");

    const languageBox = document.createElement("div");
    languageBox.style.marginBottom = "20px";

    const languageLabel = document.createElement("label");
    languageLabel.htmlFor = "languageSelector";
    languageLabel.style.display = "block";
    languageLabel.style.marginBottom = "8px";
    languageLabel.style.fontWeight = "bold";

    const languageSelector = document.createElement("select");
    languageSelector.id = "languageSelector";
    languageSelector.style.width = "100%";
    languageSelector.style.padding = "12px";
    languageSelector.style.borderRadius = "10px";
    languageSelector.style.border = "1px solid #ccc";
    languageSelector.style.fontSize = "15px";

    const languages = [
        { value: "en", label: "English" },
        { value: "hr", label: "Hrvatski" },
        { value: "sq", label: "Shqip" }
    ];

    languages.forEach(function (language) {
        const option = document.createElement("option");
        option.value = language.value;
        option.textContent = language.label;
        languageSelector.appendChild(option);
    });

    languageBox.appendChild(languageLabel);
    languageBox.appendChild(languageSelector);
    main.insertBefore(languageBox, heading);

    const choiceKeys = ["email", "chat", "discord", "zoom", "other"];

    const errorKeys = {
        "Please select at least one communication option.": "selectError",
        "Previous preferences could not be loaded.": "loadError",
        "Could not save your preferences. Please try again.": "saveError"
    };

    let currentError = null;

    function updateText() {
        document.documentElement.lang = i18next.language;
        document.title = i18next.t("title");

        heading.textContent = i18next.t("title");
        question.textContent = i18next.t("question");
        legend.textContent = i18next.t("instruction");
        nextButton.textContent = i18next.t("next");
        languageLabel.textContent = i18next.t("language");

        options.forEach(function (label, index) {
            const textNode = Array.from(label.childNodes).find(function (node) {
                return node.nodeType === 3 && node.textContent.trim();
            });

            if (textNode) {
                textNode.textContent = " " + i18next.t(choiceKeys[index]);
            }
        });

        if (currentError) {
            message.textContent = i18next.t(currentError);
        }
    }

    const observer = new MutationObserver(function () {
        const text = message.textContent.trim();

        if (!text) {
            currentError = null;
            return;
        }

        if (errorKeys[text]) {
            currentError = errorKeys[text];
        }

        if (currentError) {
            const translated = i18next.t(currentError);

            if (message.textContent !== translated) {
                message.textContent = translated;
            }
        }
    });

    let savedLanguage = "en";

    try {
        savedLanguage = localStorage.getItem("appLanguage") || "en";
    } catch (error) {
        savedLanguage = "en";
    }

    if (!resources[savedLanguage]) {
        savedLanguage = "en";
    }

    i18next.init({
        lng: savedLanguage,
        fallbackLng: "en",
        resources: resources
    }).then(function () {
        languageSelector.value = savedLanguage;

        observer.observe(message, {
            childList: true,
            characterData: true,
            subtree: true
        });

        if (errorKeys[message.textContent.trim()]) {
            currentError = errorKeys[message.textContent.trim()];
        }

        updateText();

        languageSelector.addEventListener("change", function () {
            const selectedLanguage = languageSelector.value;

            i18next.changeLanguage(selectedLanguage).then(function () {
                try {
                    localStorage.setItem("appLanguage", selectedLanguage);
                } catch (error) {
                }

                updateText();
            });
        });
    });
})();
</script>
</body>
</html>
