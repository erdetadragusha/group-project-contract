<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Availability</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #263b63;
        }

        p {
            text-align: center;
            color: #555;
        }

        .back {
            color: #3458a4;
            text-decoration: none;
        }

        h2 {
            font-size: 18px;
            margin-top: 30px;
        }

        .schedule {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 10px 4px;
            border: 1px solid #ddd;
            font-size: 12px;
        }

        th {
            background-color: #eef3ff;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3458a4;
            cursor: pointer;
        }

        .flexible {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3458a4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #263b63;
        }

        button:focus-visible,
        input:focus-visible,
        a:focus-visible {
            outline: 3px solid #e09b24;
            outline-offset: 3px;
        }

        #message {
            margin-top: 15px;
        }

        @media (max-width: 450px) {
            .container {
                padding: 18px;
            }

            th, td {
                padding: 8px 2px;
                font-size: 11px;
            }

            input[type="checkbox"] {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <a href="communication.html" class="back">
            ← Back
        </a>

        <h1>Weekly Availability</h1>

        <p>When are you usually available to work on your group project?</p>

        <form id="availabilityForm">

            <h2>Select your available times</h2>

            <div class="schedule">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Time</th>
                            <th scope="col">Mon</th>
                            <th scope="col">Tue</th>
                            <th scope="col">Wed</th>
                            <th scope="col">Thu</th>
                            <th scope="col">Fri</th>
                            <th scope="col">Sat</th>
                            <th scope="col">Sun</th>
                        </tr>
                    </thead>

                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>

            <label class="flexible">
                <input type="checkbox" id="flexible">
                I have a flexible schedule
            </label>

            <button type="submit">Next</button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

    </main>

    <script>
        const days = [
            "Monday", "Tuesday", "Wednesday",
            "Thursday", "Friday", "Saturday", "Sunday"
        ];

        const times = [
            "Morning",
            "Afternoon",
            "Evening"
        ];

        const scheduleBody = document.getElementById("scheduleBody");
        const flexibleInput = document.getElementById("flexible");
        const message = document.getElementById("message");

        times.forEach(time => {
            const row = document.createElement("tr");

            const heading = document.createElement("th");
            heading.scope = "row";
            heading.textContent = time;
            row.appendChild(heading);

            days.forEach(day => {
                const cell = document.createElement("td");
                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.name = "availability";
                checkbox.value = day + "-" + time;
                checkbox.setAttribute("aria-label", day + " " + time);

                cell.appendChild(checkbox);
                row.appendChild(cell);
            });

            scheduleBody.appendChild(row);
        });

        try {
            const saved = JSON.parse(
                localStorage.getItem("weeklyAvailability") || "null"
            );

            if (saved) {
                document.querySelectorAll(
                    'input[name="availability"]'
                ).forEach(input => {
                    input.checked = saved.times.includes(input.value);
                });

                flexibleInput.checked = saved.flexible;
            }
        } catch (error) {
            message.textContent = "Previous choices could not be loaded.";
        }

        document.getElementById("availabilityForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const selected = Array.from(
                    document.querySelectorAll(
                        'input[name="availability"]:checked'
                    )
                ).map(input => input.value);

                const flexible = flexibleInput.checked;

                if (selected.length === 0 && !flexible) {
                    message.textContent =
                        "Please select a time or choose a flexible schedule.";
                    return;
                }

                try {
                    localStorage.setItem(
                        "weeklyAvailability",
                        JSON.stringify({
                            times: selected,
                            flexible: flexible
                        })
                    );

                    message.textContent =
                        "Availability saved for this demo! The next screen will be connected soon.";

                } catch (error) {
                    message.textContent =
                        "Could not save availability. Please try again.";
                }
            });
    </script>

</body>
</html>
