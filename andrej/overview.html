<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contract overview | Group Project Contract</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#main" data-i18n="a11y.skipToContent">
        Skip to content
    </a>

    <header class="topbar">
        <span></span>

        <div class="language-control">
            <label for="language-select" data-i18n="common.language">
                Language
            </label>

            <select id="language-select" disabled>
                <option value="en" lang="en">English</option>
                <option value="hr" lang="hr">Hrvatski</option>
                <option value="sq" lang="sq">Shqip</option>
            </select>
        </div>
    </header>

    <p id="offline-banner"
       class="banner banner-warn"
       role="status"
       data-i18n="states.offlineBanner"
       hidden></p>

    <p id="language-message" class="banner banner-warn" role="alert" hidden>
        The page could not load its texts. Check your connection and reload.
    </p>

    <main id="main" class="content">
        <h1 data-i18n="overview.title">Contract overview</h1>

        <div id="state" aria-live="polite"></div>

        <div id="content" hidden></div>
    </main>

    <div id="footer" class="sticky-footer">
        <a class="button"
           href="sections.html"
           data-link="sections.html"
           data-i18n="overview.viewContract">
            View full contract
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/i18next@23.16.8/dist/umd/i18next.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../mateo/supabase-client.js"></script>

    <script src="common.js"></script>
    <script src="forms.js"></script>
    <script src="overview.js"></script>
</body>
</html>
