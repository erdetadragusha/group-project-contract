<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team members | Group Project Contract</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="welcome">
        <div class="language-control">
            <label for="language-select" data-i18n="language">
                Language
            </label>

            <select id="language-select" name="language">
                <option value="en" lang="en">English</option>
                <option value="hr" lang="hr">Hrvatski</option>
                <option value="sq" lang="sq">Shqip</option>
            </select>
        </div>

        <a href="my-teams.html" class="back-link" data-my-teams-link>
            My teams
        </a>

        <h1>Team members</h1>
        <p id="members-summary">Loading your team...</p>

        <section class="status-card" aria-labelledby="joined-heading">
            <h2 id="joined-heading">Joined members</h2>
            <ul id="members-list" class="invite-list"></ul>
        </section>

        <section class="status-card" aria-labelledby="invitations-heading">
            <h2 id="invitations-heading">Invitations</h2>
            <p id="members-empty">Loading invitations...</p>
            <ul id="members-invitations" class="invite-list"></ul>
        </section>

        <p id="members-message" role="status"></p>

        <nav id="members-navigation" class="welcome-actions"
            aria-label="Team actions">

            <a id="members-invite-link" class="button" hidden>
                Invite members
            </a>

            <a id="edit-team-link" class="button button-secondary" hidden>
                Edit team
            </a>

            <a class="button button-secondary"
                data-team-page="invitation-status.html"
                data-status-label="statusLink">
                View invitation status
            </a>

            <a id="open-team-setup" class="button button-secondary" hidden>
                Review team setup
            </a>

            <button type="button" id="refresh-members"
                class="button button-secondary">
                Refresh
            </button>

            <a href="index.html" class="back-link">Back to welcome</a>
        </nav>
    </main>

    <script src="language.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="script.js"></script>
    <script src="status-page.js"></script>
    <script src="team-complete.js"></script>
    <script src="my-teams.js"></script>
    <script src="edit-team.js"></script>
</body>
</html>
