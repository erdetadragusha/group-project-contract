<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join team | Group Project Contract</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="welcome">
        <div class="language-control">
            <label for="language-select" data-i18n="language">
                Language
            </label>

            <select id="language-select" name="language">
                <option value="en" lang="en">English</option>
                <option value="hr" lang="hr">Hrvatski</option>
                <option value="sq" lang="sq">Shqip</option>
            </select>
        </div>

        <h1>Join a team</h1>

        <section class="status-card">
            <h2>Team invitation</h2>
            <p id="join-details">Loading invitation...</p>
        </section>

        <div class="welcome-actions">
            <button type="button" id="accept-invitation"
                class="button" disabled>
                Accept invitation
            </button>

            <button type="button" id="decline-invitation"
                class="button button-secondary" disabled>
                Decline invitation
            </button>
        </div>

        <p id="join-message" role="status"></p>

        <nav id="join-links" class="welcome-actions"
            aria-label="Invitation navigation"></nav>
    </main>

    <script src="language.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="script.js"></script>
</body>
</html>
