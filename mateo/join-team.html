<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join team | Group Project Contract</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="welcome">
        <h1>Join a team</h1>
        <p>Review your invitation before joining.</p>

        <section class="status-card" aria-labelledby="invitation-heading">
            <h2 id="invitation-heading">No invitation available</h2>
            <p>
                Open your invitation link to see the team and project
                details. Invitation acceptance is not connected yet.
            </p>
        </section>

        <div class="welcome-actions">
            <button type="button" class="button" disabled>
                Accept invitation
            </button>

            <button type="button" class="button button-secondary" disabled>
                Decline invitation
            </button>

            <a href="index.html" class="back-link">Back to welcome</a>
        </div>
    </main>
</body>
</html>
