<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="loginTitle">Log in | Group Project Contract</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="welcome">
        <div class="language-control">
            <label for="language-select" data-i18n="language">
                Language
            </label>

            <select id="language-select" name="language">
                <option value="en" lang="en">English</option>
                <option value="hr" lang="hr">Hrvatski</option>
                <option value="sq" lang="sq">Shqip</option>
            </select>
        </div>

        <a href="index.html" class="back-link" data-i18n="backWelcome">
            Back to welcome
        </a>

        <h1 data-i18n="login">Log in</h1>

        <p data-i18n="loginIntroduction">
            Continue working with your team.
        </p>

        <form id="login-form" class="account-form">
            <label for="email" data-i18n="email">Email</label>
            <input type="email" id="email" name="email"
                autocomplete="email" required>

            <label for="password" data-i18n="password">Password</label>
            <input type="password" id="password" name="password"
                autocomplete="current-password" required>

            <button type="submit" class="button" data-i18n="login">
                Log in
            </button>

            <p id="login-message" role="status"></p>
        </form>

        <p>
            <span data-i18n="noAccount">Don't have an account?</span>
            <a href="signup.html" data-i18n="signupButton">Sign up</a>
        </p>
    </main>

    <script src="language.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="script.js"></script>
</body>
</html>
