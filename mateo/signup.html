<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Group Project Contract</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="welcome">
        <a href="index.html" class="back-link">Back to welcome</a>

        <h1>Create an account</h1>
        <p>Sign up to start working with your team.</p>

        <form id="signup-form" class="account-form">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name"
                autocomplete="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                autocomplete="new-password" minlength="8"
                aria-describedby="password-help" required>
            <small id="password-help">Use at least 8 characters.</small>

            <button type="submit" class="button">Sign up</button>

            <p id="signup-message" role="status"></p>
        </form>

        <p>Already have an account? <a href="login.html">Log in</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="script.js"></script>
</body>
</html>
