<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.signup.pageTitle">
        Sign up | Group Project Contract
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="welcome">
        <div class="language-control">
            <label for="language-select" data-i18n="common.language">
                Language
            </label>

            <select id="language-select" name="language" disabled>
                <option value="en" lang="en">English</option>
                <option value="hr" lang="hr">Hrvatski</option>
                <option value="sq" lang="sq">Shqip</option>
            </select>
        </div>

        <a href="index.html" class="back-link"
            data-i18n="auth.backWelcome">
            Back to welcome
        </a>

        <h1 data-i18n="auth.signup.heading">Create an account</h1>

        <p data-i18n="auth.signup.description">
            Sign up to start working with your team.
        </p>

        <form id="signup-form" class="account-form">
            <label for="name" data-i18n="auth.fullName">
                Full name
            </label>

            <input type="text" id="name" name="name"
                autocomplete="name"
                aria-describedby="signup-message" required>

            <label for="email" data-i18n="auth.email">
                Email
            </label>

            <input type="email" id="email" name="email"
                autocomplete="email"
                aria-describedby="signup-message" required>

            <label for="password" data-i18n="auth.password">
                Password
            </label>

            <input type="password" id="password" name="password"
                autocomplete="new-password" minlength="8"
                aria-describedby="password-help signup-message" required>

            <small id="password-help" data-i18n="auth.passwordHelp">
                Use at least 8 characters.
            </small>

            <button type="submit" class="button"
                data-i18n="auth.signup.button">
                Sign up
            </button>

            <p id="signup-message" role="status"></p>
        </form>

        <p>
            <span data-i18n="auth.signup.alreadyAccount">
                Already have an account?
            </span>
            <a href="login.html" data-i18n="auth.login.button">
                Log in
            </a>
        </p>

        <p id="language-message" role="alert" hidden>
            Language files could not be loaded. Please reload the page.
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/i18next@23.16.8/dist/umd/i18next.min.js"></script>
    <script src="i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="script.js"></script>
</body>
</html>
