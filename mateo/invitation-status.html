<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation status | Group Project Contract</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="welcome">
        <div class="language-control">
            <label for="language-select" data-i18n="language">
                Language
            </label>

            <select id="language-select" name="language">
                <option value="en" lang="en">English</option>
                <option value="hr" lang="hr">Hrvatski</option>
                <option value="sq" lang="sq">Shqip</option>
            </select>
        </div>

        <h1 data-status-label="heading">Invitation status</h1>

        <p id="status-team"></p>

        <section class="status-card">
            <h2 data-status-label="listHeading">Team invitations</h2>
            <ul id="status-list" class="invite-list"></ul>
            <p id="status-empty" hidden></p>
        </section>

        <p data-status-label="deliveryNote">
            These statuses track invitation responses.
            Invitation emails are not sent automatically.
        </p>

        <p id="status-message" role="status"></p>

        <nav class="welcome-actions"
            aria-label="Invitation navigation"
            id="status-navigation">

            <button type="button" id="status-refresh"
                class="button button-secondary"
                data-status-label="refresh">
                Refresh
            </button>

            <a class="button button-secondary"
                data-team-page="team-members.html"
                data-status-label="members">
                View team members
            </a>

            <a id="status-invite-link" class="button"
                data-team-page="invite-members.html"
                data-status-label="invite" hidden>
                Invite members
            </a>
        </nav>
    </main>

    <script src="language.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="status-page.js"></script>
</body>
</html>
