<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="projectTitle">Project details | Group Project Contract</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="welcome">
        <div class="language-control">
            <label for="language-select" data-i18n="language">
                Language
            </label>

            <select id="language-select" name="language">
                <option value="en" lang="en">English</option>
                <option value="hr" lang="hr">Hrvatski</option>
                <option value="sq" lang="sq">Shqip</option>
            </select>
        </div>

        <a href="create-team.html" class="back-link" data-i18n="backTeam">
            Back to create team
        </a>

        <h1 data-i18n="projectDetails">Project details</h1>
        <p id="team-summary"></p>

        <form id="project-details-form" class="account-form">
            <label for="project-name" data-i18n="projectName">
                Project name
            </label>

            <input type="text" id="project-name" name="projectName"
                maxlength="100" required>

            <label for="project-description" data-i18n="projectDescription">
                Project description
            </label>

            <textarea id="project-description" name="description"
                rows="4" maxlength="1000" required></textarea>

            <button type="submit" class="button" data-i18n="continueButton">
                Continue
            </button>

            <p id="project-message" role="status"></p>
        </form>
    </main>

    <script src="language.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="script.js"></script>
</body>
</html>
